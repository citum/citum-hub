name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'server/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
            frontend:
              - 'client/**'
              - 'package.json'
              - 'bun.lock'
              - 'server/crates/wasm-bridge/**'
            docker:
              - 'Dockerfile*'
              - 'docker-compose.yml'

  backend:
    needs: filter
    if: needs.filter.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
      - run: cargo check --manifest-path server/Cargo.toml
      - run: cargo clippy --manifest-path server/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path server/Cargo.toml

  wasm:
    needs: filter
    if: needs.filter.outputs.backend == 'true' || needs.filter.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: wasm-pack build --target nodejs
        working-directory: server/crates/wasm-bridge
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-pkg
          path: server/crates/wasm-bridge/pkg

  frontend:
    needs: [filter, wasm]
    if: needs.filter.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v8
        with:
          name: wasm-pkg
          path: server/crates/wasm-bridge/pkg
      - run: bun install
        working-directory: client
      - run: bun run lint
        working-directory: client
      - run: bun run format:check
        working-directory: client
      - run: bun run check
        working-directory: client
      - run: bun run build
        working-directory: client

  docker:
    needs: filter
    if: needs.filter.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f Dockerfile.citum .

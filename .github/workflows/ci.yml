name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dorny/paths-filter@6852f92c20ea7fd3b0c25de3b5112db3a98da050 # v3
        id: filter
        with:
          filters: |
            backend:
              - 'server/**'
              - 'Cargo.*'
              - 'rust-toolchain.toml'
            frontend:
              - 'client/**'
              - 'package.json'
              - 'bun.lock'
              - 'server/crates/wasm-bridge/**'
            docker:
              - 'Dockerfile*'
              - 'docker-compose.yml'

  backend:
    needs: filter
    if: needs.filter.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: server -> target
      - run: cargo check --manifest-path server/Cargo.toml
      - run: cargo clippy --manifest-path server/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path server/Cargo.toml

  wasm:
    needs: filter
    if: needs.filter.outputs.backend == 'true' || needs.filter.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: wasm-pack build --target nodejs
        working-directory: server/crates/wasm-bridge
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-pkg
          path: server/crates/wasm-bridge/pkg

  frontend:
    needs: [filter, wasm]
    if: needs.filter.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wasm-pkg
          path: server/crates/wasm-bridge/pkg
      - run: bun install
        working-directory: client
      - run: bun run lint
        working-directory: client
      - run: bun run format:check
        working-directory: client
      - run: bun run check
        working-directory: client
      - run: bun run build
        working-directory: client

  docker:
    needs: filter
    if: needs.filter.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: docker build -f Dockerfile.citum .
